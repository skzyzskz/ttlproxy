name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesi olustur
        run: xcodegen generate

      - name: Derle (imzasiz)
        run: |
          xcodebuild -project TTLProxy.xcodeproj -target TTLProxy \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TTLProxy.app Payload/
          zip -qr TTLProxy.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TTLProxy-ipa
          path: TTLProxy.ipa
